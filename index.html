<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f4"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>料理メモ</title><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4"><link rel="icon" type="image/png" href="./favicon.png?v=4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="料理メモ"><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#29332b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:720px;margin:auto;padding:22px 16px 90px}header,.between,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:24px}h1{font-size:25px;margin:3px 0}h2{font-size:24px}h3{font-size:15px;color:#647466;margin:24px 0 10px}small,.sub{color:#8a9489}button,input,textarea{font:inherit}button{border:0;border-radius:12px;background:#edf0e9;padding:12px 15px;color:#344536;cursor:pointer}.primary{background:#366247;color:white}.danger{background:#fff0ef;color:#ad4444}.ghost{background:transparent;padding-left:0}input,textarea{border:1px solid #dce2d9;background:white;border-radius:12px;padding:13px;width:100%;outline:none}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus{border-color:#528767}label{font-size:13px;font-weight:650;display:block;margin:21px 0 8px}.card{background:white;border:1px solid #e8ece6;border-radius:18px;padding:20px;margin:10px 0}.item{width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center}.item strong{font-size:17px}.item .sub{font-size:13px;margin-top:5px}.search{margin-bottom:13px}.ingredients{display:grid;gap:8px}.ingredient{display:grid;grid-template-columns:1fr 105px 35px;gap:7px}.ingredient button{padding:0}.groupHeader{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px;background:#edf2e9;border-radius:12px}.groupHeader input{flex:1;min-width:0;font-weight:700}.groupHeader button{flex-shrink:0}.viewGroup{font-weight:750;color:#356148;margin-top:18px;padding:8px 10px;background:#edf2e9;border-radius:8px}.line{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #edf0ea}.line span:last-child{font-weight:600;white-space:pre-wrap}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:24px}.source{word-break:break-all;color:#366b4c}.empty{text-align:center;padding:60px 0;color:#889388}.note{white-space:pre-wrap;line-height:1.8}.recipePhoto{display:block;width:100%;max-height:330px;object-fit:cover;border-radius:14px;margin:12px 0}.recipePhoto[hidden]{display:none}.portion{display:flex;align-items:center;gap:12px;margin:12px 0}.portion button{font-size:20px;min-width:44px}.portion strong{min-width:50px;text-align:center}.updateBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.updateBar button{padding:8px 12px;font-size:13px}.updateBar small{font-size:12px}#detail,#edit{display:none}</style></head><body><main><header><div><small>MY RECIPE BOOK</small><h1>料理メモ</h1></div><button class="primary" id="new">＋ 追加</button></header><section id="home"><input id="search" class="search" placeholder="料理名・材料・メモを横断検索"><small id="count"></small><div class="updateBar"><button id="checkUpdate" type="button">↻ 最新版を確認</button><small id="updateStatus" aria-live="polite"></small></div><p class="sub">レシピを探す： <a class="source" href="https://cookpad.com/jp" target="_blank" rel="noopener noreferrer">クックパッド ↗</a>　<a class="source" href="https://www.kurashiru.com/" target="_blank" rel="noopener noreferrer">クラシル ↗</a>　<a class="source" href="https://delishkitchen.tv/" target="_blank" rel="noopener noreferrer">DELISH KITCHEN ↗</a></p><div id="list"></div></section><section id="detail"><button class="ghost" id="back">← 一覧に戻る</button><div class="card"><small id="servingsView"></small><h2 id="nameView"></h2><img id="photoView" class="recipePhoto" hidden alt="料理の写真"><h3>材料・分量</h3><div class="portion"><span>人数を変更</span><button id="minusPortion" type="button">−</button><strong id="portionCount">1人分</strong><button id="plusPortion" type="button">＋</button></div><small>編集時の登録人数を基準に、自動計算します</small><div id="ingredientsView"></div><div id="noteArea"><h3>作り方・メモ</h3><div class="note" id="noteView"></div></div><div id="sourceArea"><h3>参考サイト</h3><a id="sourceView" class="source" target="_blank" rel="noopener noreferrer"></a></div><div class="actions"><button id="editBtn">編集</button><button class="danger" id="deleteBtn">削除</button></div></div></section><section id="edit"><button class="ghost" id="cancelTop">← 戻る</button><div class="card"><h2 id="editHeading">料理を追加</h2><label>料理名</label><input id="name" placeholder="例：肉じゃが"><label for="servings">登録時の人数（この人数分の材料を入力）</label><input id="servings" type="number" inputmode="numeric" min="1" max="99" step="1" value="1"><div class="sub">例：2人分の材料を登録したら、表示画面で1〜99人分に換算できます。</div><label>料理の写真（任意）</label><input id="photoInput" type="file" accept="image/*"><img id="photoPreview" class="recipePhoto" hidden alt="写真プレビュー"><button id="removePhoto" type="button" class="ghost">写真を削除</button><label>材料・分量</label><div id="ingredients" class="ingredients"></div><div class="actions"><button id="addIngredient" type="button">＋ 材料を追加</button><button id="addGroup" type="button">＋ グループを追加（Aなど）</button></div><small>グループの下に調味料を追加すると、表示時にもまとめて表示されます。</small><label>作り方・メモ（任意）</label><textarea id="note" placeholder="作り方、火加減、コツなど"></textarea><label>参考サイトURL（任意）</label><div class="sub">参考：<a class="source" href="https://cookpad.com/jp" target="_blank" rel="noopener noreferrer">クックパッド</a> / <a class="source" href="https://www.kurashiru.com/" target="_blank" rel="noopener noreferrer">クラシル</a> / <a class="source" href="https://delishkitchen.tv/" target="_blank" rel="noopener noreferrer">DELISH KITCHEN</a></div><input id="source" type="url" placeholder="https://..."><div class="actions"><button class="primary" id="save">保存する</button><button id="cancel">キャンセル</button></div><small>この端末のブラウザ内に保存されます。</small></div></section></main><script>
const KEY='recipememo-v1',g=id=>document.getElementById(id),trim=v=>String(v||'').trim();let data=[],current=null,editing=null,portion=1,photoData='';try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))data=d}catch(e){}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function node(tag,value='',cls=''){const n=document.createElement(tag);n.textContent=value;n.className=cls;return n}function show(id){['home','detail','edit'].forEach(x=>g(x).style.display=x===id?'block':'none');scrollTo(0,0)}function render(){const q=trim(g('search').value).toLowerCase();const filtered=data.filter(r=>[r.name,r.servings,r.note,...r.ingredients.flatMap(i=>[i.name,i.amount])].join(' ').toLowerCase().includes(q));g('count').textContent=filtered.length+' 件のレシピ';g('list').replaceChildren();if(!filtered.length)g('list').append(node('div',q?'一致するレシピがありません':'右上の「追加」から料理を登録できます','empty'));filtered.forEach(r=>{const b=node('button','','card item'),left=node('div');left.append(node('strong',r.name),node('div',r.ingredients.slice(0,3).map(i=>i.name).join(' ・ '),'sub'));if(r.photo){const img=node('img');img.src=r.photo;img.alt='';img.style.cssText='width:64px;height:64px;object-fit:cover;border-radius:10px;margin-left:auto;margin-right:10px';b.append(img)}b.append(left,node('span','›'));b.onclick=()=>detail(r.id);g('list').append(b)})}function detail(id){const r=data.find(x=>x.id===id);if(!r){render();show('home');return}current=id;portion=1;g('nameView').textContent=r.name;g('portionCount').textContent='1人分';g('photoView').hidden=!r.photo;if(r.photo)g('photoView').src=r.photo;g('servingsView').textContent='';renderAmounts(r);g('noteArea').hidden=!r.note;g('noteView').textContent=r.note||'';g('sourceArea').hidden=!r.source;g('sourceView').textContent=r.source||'';g('sourceView').href=r.source||'#';show('detail')}function addIngredient(name='',amount=''){const row=node('div','','ingredient'),a=node('input'),b=node('input'),del=node('button','×');a.placeholder='材料名';b.placeholder='分量';a.value=name;b.value=amount;a.setAttribute('aria-label','材料名');b.setAttribute('aria-label','分量');del.onclick=()=>row.remove();row.append(a,b,del);g('ingredients').append(row)}
function addGroup(name='A'){const row=node('div','','groupHeader'),input=node('input'),del=node('button','×');input.value=name;input.placeholder='グループ名（例：A、合わせ調味料）';del.onclick=()=>{if(confirm('このグループを解除しますか？（材料は残ります）'))row.remove()};row.append(input,del);g('ingredients').append(row)}
function renderAmounts(r){g('ingredientsView').replaceChildren();let previous=null;r.ingredients.forEach(i=>{const group=trim(i.group);if(group&&group!==previous)g('ingredientsView').append(node('div',group,'viewGroup'));previous=group||null;const line=node('div','','line');line.append(node('span',i.name),node('span',scaleAmount(i.amount,portion/baseServings(r))));g('ingredientsView').append(line)})}
function editor(id=null){editing=id;const r=data.find(x=>x.id===id);g('editHeading').textContent=r?'料理を編集':'料理を追加';g('name').value=r?.name||'';g('servings').value=baseServings(r);photoData=r?.photo||'';refreshPhoto();g('note').value=r?.note||'';g('source').value=r?.source||'';g('ingredients').replaceChildren();let previousGroup='';(r?.ingredients?.length?r.ingredients:[{name:'',amount:''},{name:'',amount:''}]).forEach(i=>{const group=trim(i.group);if(group&&group!==previousGroup)addGroup(group);if(!group&&previousGroup)addGroup('');addIngredient(i.name,i.amount);previousGroup=group});show('edit')}g('new').onclick=()=>editor();g('addIngredient').onclick=()=>addIngredient();g('addGroup').onclick=()=>{const names=[...g('ingredients').querySelectorAll('.groupHeader input')].map(x=>x.value);const next='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(x=>!names.includes(x))||'調味料';addGroup(next);addIngredient()};g('back').onclick=()=>{render();show('home')};function cancel(){if(editing)detail(editing);else{render();show('home')}}g('cancel').onclick=cancel;g('cancelTop').onclick=cancel;g('editBtn').onclick=()=>editor(current);g('search').oninput=render;g('save').onclick=()=>{const name=trim(g('name').value),source=trim(g('source').value);if(!name){alert('料理名を入力してください');return}if(source&&!/^https?:\/\/\S+$/i.test(source)){alert('URLは https:// から入力してください');return}const base=Number(g('servings').value);if(!Number.isInteger(base)||base<1||base>99){alert('登録時の人数は1〜99の整数で入力してください');return}let activeGroup='';const ingredients=[];[...g('ingredients').children].forEach(x=>{if(x.classList.contains('groupHeader')){activeGroup=trim(x.children[0].value);return}const name=trim(x.children[0].value),amount=trim(x.children[1].value);if(name||amount)ingredients.push({name,amount,group:activeGroup})});const r={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2),name,servings:base,ingredients,note:trim(g('note').value),source,photo:photoData,updated:Date.now()};const previous=data.slice();if(editing)data=data.map(x=>x.id===editing?r:x);else data.unshift(r);data.sort((a,b)=>b.updated-a.updated);try{persist()}catch(e){data=previous;alert('保存に失敗しました');return}render();detail(r.id)};g('deleteBtn').onclick=()=>{const r=data.find(x=>x.id===current);if(r&&confirm('「'+r.name+'」を削除しますか？')){data=data.filter(x=>x.id!==current);persist();render();show('home')}};
function baseServings(r){const n=parseInt(String(r?.servings??'1'),10);return Number.isFinite(n)&&n>=1&&n<=99?n:1}
function scaleAmount(value,n){return String(value||'').replace(/\d+\/\d+|\d+(?:\.\d+)?/g,m=>{let v=m.includes('/')?m.split('/').reduce((a,b)=>a/Number(b)):Number(m);if(!Number.isFinite(v))return m;return String(Math.round(v*n*100)/100)})}
function setPortion(n){portion=Math.max(1,Math.min(99,n));g('portionCount').textContent=portion+'人分';const r=data.find(x=>x.id===current);if(r)renderAmounts(r)}
g('minusPortion').onclick=()=>setPortion(portion-1);g('plusPortion').onclick=()=>setPortion(portion+1);
function refreshPhoto(){g('photoPreview').hidden=!photoData;g('removePhoto').hidden=!photoData;if(photoData)g('photoPreview').src=photoData;g('photoInput').value=''}
g('removePhoto').onclick=()=>{photoData='';refreshPhoto()};
g('photoInput').onchange=()=>{const f=g('photoInput').files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選択してください');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=850,ratio=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',0.65);refreshPhoto()};img.src=reader.result};reader.readAsDataURL(f)};
const APP_VERSION='2026-10-15-update-1';
async function checkForUpdate(manual=false){
 const status=g('updateStatus'),button=g('checkUpdate');
 if(manual){button.disabled=true;status.textContent='確認中…'}
 try{
  const url=new URL(location.href);url.searchParams.set('check',String(Date.now()));
  const response=await fetch(url.toString(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!response.ok)throw new Error('fetch');
  const html=await response.text();
  const match=html.match(/const APP_VERSION='([^']+)'/);
  if(!match){if(manual)status.textContent='更新情報を確認できませんでした';return}
  if(match[1]!==APP_VERSION){
   status.textContent='新しいバージョンがあります';
   if(manual&&confirm('最新版を読み込みますか？ 未保存の編集内容は失われます。')){
    const fresh=new URL(location.href);fresh.searchParams.set('v',String(Date.now()));location.replace(fresh.toString())
   }
  }else if(manual){status.textContent='最新版です'}
 }catch(e){if(manual)status.textContent='通信できませんでした。再度お試しください'}
 finally{button.disabled=false}
}
g('checkUpdate').onclick=()=>checkForUpdate(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate(false)});
window.addEventListener('pageshow',e=>{if(e.persisted)checkForUpdate(false)});
render();
</script></body></html>
