<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f4"><title>料理メモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#29332b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:720px;margin:auto;padding:22px 16px 90px}header,.between,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:24px}h1{font-size:25px;margin:3px 0}h2{font-size:24px}h3{font-size:15px;color:#647466;margin:24px 0 10px}small,.sub{color:#8a9489}button,input,textarea{font:inherit}button{border:0;border-radius:12px;background:#edf0e9;padding:12px 15px;color:#344536;cursor:pointer}.primary{background:#366247;color:white}.danger{background:#fff0ef;color:#ad4444}.ghost{background:transparent;padding-left:0}input,textarea{border:1px solid #dce2d9;background:white;border-radius:12px;padding:13px;width:100%;outline:none}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus{border-color:#528767}label{font-size:13px;font-weight:650;display:block;margin:21px 0 8px}.card{background:white;border:1px solid #e8ece6;border-radius:18px;padding:20px;margin:10px 0}.item{width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center}.item strong{font-size:17px}.item .sub{font-size:13px;margin-top:5px}.search{margin-bottom:13px}.ingredients{display:grid;gap:8px}.ingredient{display:grid;grid-template-columns:1fr 105px 35px;gap:7px}.ingredient button{padding:0}.line{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #edf0ea}.line span:last-child{font-weight:600;white-space:pre-wrap}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:24px}.source{word-break:break-all;color:#366b4c}.empty{text-align:center;padding:60px 0;color:#889388}.note{white-space:pre-wrap;line-height:1.8}#detail,#edit{display:none}</style><link rel="icon" type="image/png" href="./6FFEEB73-2583-495B-AEB8-4E9FB71836C9.png?v=2"><link rel="apple-touch-icon" sizes="180x180" href="./6FFEEB73-2583-495B-AEB8-4E9FB71836C9.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="料理メモ"></head><body><main><header><div><small>MY RECIPE BOOK</small><h1>料理メモ</h1></div><button class="primary" id="new">＋ 追加</button></header><section id="home"><input id="search" class="search" placeholder="料理名・材料・メモを横断検索"><small id="count"></small><div id="list"></div></section><section id="detail"><button class="ghost" id="back">← 一覧に戻る</button><div class="card"><small id="servingsView"></small><h2 id="nameView"></h2><h3>材料・分量</h3><div id="ingredientsView"></div><div id="noteArea"><h3>作り方・メモ</h3><div class="note" id="noteView"></div></div><div id="sourceArea"><h3>参考サイト</h3><a id="sourceView" class="source" target="_blank" rel="noopener noreferrer"></a></div><div class="actions"><button id="editBtn">編集</button><button class="danger" id="deleteBtn">削除</button></div></div></section><section id="edit"><button class="ghost" id="cancelTop">← 戻る</button><div class="card"><h2 id="editHeading">料理を追加</h2><label>料理名</label><input id="name" placeholder="例：肉じゃが"><label>何人分</label><input id="servings" placeholder="例：1人分"><label>材料・分量</label><div id="ingredients" class="ingredients"></div><button id="addIngredient" style="margin-top:10px">＋ 材料を追加</button><label>作り方・メモ（任意）</label><textarea id="note" placeholder="作り方、火加減、コツなど"></textarea><label>参考サイトURL（任意）</label><input id="source" type="url" placeholder="https://..."><div class="actions"><button class="primary" id="save">保存する</button><button id="cancel">キャンセル</button></div><small>この端末のブラウザ内に保存されます。</small></div></section></main><script>
const KEY='recipememo-v1',g=id=>document.getElementById(id),trim=v=>String(v||'').trim();let data=[],current=null,editing=null;try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))data=d}catch(e){}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function node(tag,value='',cls=''){const n=document.createElement(tag);n.textContent=value;n.className=cls;return n}function show(id){['home','detail','edit'].forEach(x=>g(x).style.display=x===id?'block':'none');scrollTo(0,0)}function render(){const q=trim(g('search').value).toLowerCase();const filtered=data.filter(r=>[r.name,r.servings,r.note,...r.ingredients.flatMap(i=>[i.name,i.amount])].join(' ').toLowerCase().includes(q));g('count').textContent=filtered.length+' 件のレシピ';g('list').replaceChildren();if(!filtered.length)g('list').append(node('div',q?'一致するレシピがありません':'右上の「追加」から料理を登録できます','empty'));filtered.forEach(r=>{const b=node('button','','card item'),left=node('div');left.append(node('strong',r.name),node('div',r.ingredients.slice(0,3).map(i=>i.name).join(' ・ '),'sub'));b.append(left,node('span','›'));b.onclick=()=>detail(r.id);g('list').append(b)})}function detail(id){const r=data.find(x=>x.id===id);if(!r){render();show('home');return}current=id;g('nameView').textContent=r.name;g('servingsView').textContent=r.servings||'';g('ingredientsView').replaceChildren();r.ingredients.forEach(i=>{const line=node('div','','line');line.append(node('span',i.name),node('span',i.amount));g('ingredientsView').append(line)});g('noteArea').hidden=!r.note;g('noteView').textContent=r.note||'';g('sourceArea').hidden=!r.source;g('sourceView').textContent=r.source||'';g('sourceView').href=r.source||'#';show('detail')}function addIngredient(name='',amount=''){const row=node('div','','ingredient'),a=node('input'),b=node('input'),del=node('button','×');a.placeholder='材料名';b.placeholder='分量';a.value=name;b.value=amount;a.setAttribute('aria-label','材料名');b.setAttribute('aria-label','分量');del.onclick=()=>row.remove();row.append(a,b,del);g('ingredients').append(row)}function editor(id=null){editing=id;const r=data.find(x=>x.id===id);g('editHeading').textContent=r?'料理を編集':'料理を追加';g('name').value=r?.name||'';g('servings').value=r?.servings||'1人分';g('note').value=r?.note||'';g('source').value=r?.source||'';g('ingredients').replaceChildren();(r?.ingredients?.length?r.ingredients:[{name:'',amount:''},{name:'',amount:''}]).forEach(i=>addIngredient(i.name,i.amount));show('edit')}g('new').onclick=()=>editor();g('addIngredient').onclick=()=>addIngredient();g('back').onclick=()=>{render();show('home')};function cancel(){if(editing)detail(editing);else{render();show('home')}}g('cancel').onclick=cancel;g('cancelTop').onclick=cancel;g('editBtn').onclick=()=>editor(current);g('search').oninput=render;g('save').onclick=()=>{const name=trim(g('name').value),source=trim(g('source').value);if(!name){alert('料理名を入力してください');return}if(source&&!/^https?:\/\/\S+$/i.test(source)){alert('URLは https:// から入力してください');return}const ingredients=[...g('ingredients').children].map(x=>({name:trim(x.children[0].value),amount:trim(x.children[1].value)})).filter(x=>x.name||x.amount);const r={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2),name,servings:trim(g('servings').value),ingredients,note:trim(g('note').value),source,updated:Date.now()};const previous=data.slice();if(editing)data=data.map(x=>x.id===editing?r:x);else data.unshift(r);data.sort((a,b)=>b.updated-a.updated);try{persist()}catch(e){data=previous;alert('保存に失敗しました');return}render();detail(r.id)};g('deleteBtn').onclick=()=>{const r=data.find(x=>x.id===current);if(r&&confirm('「'+r.name+'」を削除しますか？')){data=data.filter(x=>x.id!==current);persist();render();show('home')}};render();
</script></body></html>
