name: Build home screen icons
on:
  push:
    paths:
      - '.github/workflows/build-icons.yml'
      - '6FFEEB73-2583-495B-AEB8-4E9FB71836C9.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Generate standard-size PNG icons
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('6FFEEB73-2583-495B-AEB8-4E9FB71836C9.png').convert('RGB')
          for size, name in [(180, 'apple-touch-icon.png'), (192, 'icon-192.png'), (512, 'icon-512.png'), (32, 'favicon.png')]:
              im.resize((size, size), Image.Resampling.LANCZOS).save(name, optimize=True)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png favicon.png
          git diff --cached --quiet || (git commit -m "Generate correctly sized home screen icons" && git push)
